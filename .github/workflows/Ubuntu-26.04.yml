name: CI ssh (Ubuntu 26.04)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            curl \
            wget \
            unzip \
            build-essential \
            llvm \
            clang \
            lld \
            busybox \
            cpio \
            flex \
            bison \
            bc \
            ccache \
            libselinux* \
            python3 \
            python-is-python3 \
            python3-pip \
            build-essential \
            make \
            cmake \
            automake \
            autoconf \
            m4 \
            pkg-config \
            libxml2-16 \
            xsltproc \
            xz-utils \
            zstd \
            lz4 \
            gzip \
            bzip2 \
            openjdk-11-jdk \
            git-lfs \
            rsync \
            zip \
            gcc \
            g++ \
            kmod \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            libdw-dev \
            dwarves \
            python3-venv \
            file \
            ca-certificates \
            pigz

      - name: Setup repo
        run: |
          mkdir -p /usr/local/bin
          sudo curl -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod +x /usr/local/bin/repo
          repo --version

      - name: Configure git
        run: |
          git config --global user.name "Subham Nayak"
          git config --global user.email "fstab.subhu@gmail.com"

      # Add your build/setup steps here
      - name: Test
        run: |
          pwd
          ls -la

      - name: SSH Debug (tmate)
        uses: lhotari/action-upterm@v1
        with:
          limit-access-to-actor: false
